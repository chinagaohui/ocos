[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ocos"
version = "1.0.0"
description = "Organic Cognitive Operating System — digital organism kernel"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "OCOS Team"},
]
# U3.2（2026-08-19）：从 import 图推导的运行时依赖声明（F-05 关闭）
# 注意：opentale 不列入（架构约束：OCOS 仅经 HTTP 访问 OpenTale，见 F-18/U1.3）
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "psutil>=5.9.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--tb=short"]
timeout = 300

[tool.setuptools.packages.find]
include = ["ocos*"]
