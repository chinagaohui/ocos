<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCOS 数字生命</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
          --dim:#8b93a3; --user:#2b5fd9; --bot:#1f2937; --accent:#4f8cff; --warn:#c9a227; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; height:100vh; }
  #chat { flex:1; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  #stream { flex:1; overflow-y:auto; padding:20px; display:flex;
            flex-direction:column; gap:12px; }
  .msg { max-width:72%; padding:10px 14px; border-radius:12px;
         white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff;
          border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bot);
          border-bottom-left-radius:4px; }
  .bot.mock { background:#141820; border:1px dashed var(--warn); }
  .tag { display:block; margin-top:6px; color:var(--warn); font-size:11px; }
  #inputbar { display:flex; gap:10px; padding:14px 20px;
              border-top:1px solid var(--line); }
  #input { flex:1; background:var(--panel); color:var(--fg);
           border:1px solid var(--line); border-radius:10px;
           padding:11px 14px; font-size:14px; outline:none; }
  #input:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:none;
           border-radius:10px; padding:11px 20px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #side { width:280px; border-left:1px solid var(--line);
          padding:18px; overflow-y:auto; background:var(--panel); }
  #side h2 { font-size:13px; color:var(--dim); margin:14px 0 8px;
             text-transform:uppercase; letter-spacing:.05em; }
  .stat { display:flex; justify-content:space-between; padding:4px 0;
          font-size:13px; }
  .stat b { font-weight:600; }
  .card { border:1px solid var(--line); border-radius:10px;
          padding:10px; margin-bottom:8px; font-size:13px; }
  .card .row { display:flex; gap:8px; margin-top:8px; }
  .card button { flex:1; padding:6px; font-size:12px; }
  .card button.deny { background:#3a2030; }
  .empty { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div id="chat">
  <header>
    <h1>OCOS 数字生命</h1>
    <div class="sub">本地认知引擎 · 对话/目标/待批 · 与 CLI 同一数据源</div>
  </header>
  <div id="stream"></div>
  <div id="inputbar">
    <input id="input" placeholder="说点什么…（⏎ 发送）" autofocus>
    <button id="send">发送</button>
  </div>
</div>
<div id="side">
  <h2>状态</h2>
  <div id="stats"><div class="empty">加载中…</div></div>
  <h2>待批动作</h2>
  <div id="approvals"><div class="empty">加载中…</div></div>
</div>
<script>
const stream = document.getElementById("stream");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function bubble(text, who, mock) {
  const div = document.createElement("div");
  div.className = "msg " + who + (mock ? " mock" : "");
  div.textContent = text;
  if (mock) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "状态回复（未配置 LLM key）";
    div.appendChild(tag);
  }
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  bubble(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  try {
    const r = await fetch("/ocos/converse", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text}),
    });
    const j = await r.json();
    if (j.success) bubble(j.data.reply, "bot", j.data.mock);
    else bubble("出错了: " + j.message, "bot");
  } catch (e) {
    bubble("连接失败（ocos-server 在跑吗？）: " + e, "bot");
  }
  sendBtn.disabled = false;
  input.focus();
  refreshSide();
}
sendBtn.onclick = send;
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

async function refreshSide() {
  try {
    const s = await (await fetch("/ocos/summary")).json();
    const d = s.data, el = document.getElementById("stats");
    const g = d.goals || {};
    el.innerHTML =
      `<div class="stat"><span>目标 PENDING / ACTIVE</span><b>${g.PENDING||0} / ${g.ACTIVE||0}</b></div>` +
      `<div class="stat"><span>待批动作</span><b>${d.approvals_pending}</b></div>` +
      `<div class="stat"><span>收件箱未读</span><b>${d.inbox_queued}</b></div>` +
      `<div class="stat"><span>episodes</span><b>${(d.memory||{}).episodes||0}</b></div>` +
      `<div class="stat"><span>beliefs</span><b>${(d.memory||{}).beliefs||0}</b></div>`;

    const a = await (await fetch("/ocos/approvals")).json();
    const box = document.getElementById("approvals");
    const rows = a.data.pending;
    if (!rows.length) { box.innerHTML = '<div class="empty">（无待批动作）</div>'; }
    else {
      box.innerHTML = "";
      for (const r of rows) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<b>${r.id}</b> ${r.action_type}<br>
                          <span style="color:var(--dim)">${(r.text||"").slice(0,60)}</span>
                          <div class="row">
                            <button onclick="decide('${r.id}','approve')">批准</button>
                            <button class="deny" onclick="decide('${r.id}','deny')">拒绝</button>
                          </div>`;
        box.appendChild(card);
      }
    }
  } catch (e) { /* 静默 — 下一轮重试 */ }
}

async function decide(pid, action) {
  await fetch(`/ocos/approvals/${pid}/${action}`, {method: "POST"});
  refreshSide();
}

refreshSide();
setInterval(refreshSide, 5000);
input.focus();
</script>
</body>
</html>
