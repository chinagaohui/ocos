<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCOS · 数字生命</title>
<style>
  :root {
    --bg:#04060c; --cyan:#35e0ff; --violet:#7a5cff; --fg:#dfe9f5;
    --dim:#5f7086; --panel:rgba(10,18,30,.55); --line:rgba(53,224,255,.25);
    --warn:#ffc857;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #scene { position:fixed; inset:0; display:block; }

  /* ── HUD 光环（CSS 旋转） ── */
  .ring { position:fixed; left:50%; top:44%; border-radius:50%;
          border:1px dashed var(--line); pointer-events:none; }
  #ring1 { width:340px; height:340px; margin:-170px 0 0 -170px;
           animation:spin 26s linear infinite; }
  #ring2 { width:420px; height:420px; margin:-210px 0 0 -210px;
           border-style:solid; border-color:rgba(122,92,255,.14);
           animation:spin 44s linear infinite reverse; }
  #ring3 { width:270px; height:270px; margin:-135px 0 0 -135px;
           border-color:rgba(53,224,255,.4);
           animation:spin 14s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── 身份牌 ── */
  #idcard { position:fixed; top:22px; left:26px; }
  #idcard h1 { font-size:17px; letter-spacing:.35em; font-weight:600;
               color:var(--cyan); text-shadow:0 0 14px rgba(53,224,255,.55); }
  #idcard .sub { color:var(--dim); font-size:11px; letter-spacing:.2em; }
  #idcard .clock { color:var(--dim); font-size:11px; margin-top:6px;
                   font-variant-numeric:tabular-nums; }

  /* ── 核心状态文字 ── */
  #corestate { position:fixed; left:50%; top:calc(44% + 235px);
               transform:translateX(-50%); color:var(--cyan);
               font-size:12px; letter-spacing:.4em; text-transform:uppercase;
               text-shadow:0 0 10px rgba(53,224,255,.5); transition:opacity .4s; }

  /* ── 对话气泡 ── */
  #chatcol { position:fixed; left:26px; bottom:110px; width:min(430px, 42vw);
             display:flex; flex-direction:column; gap:10px; }
  .bubble { padding:10px 14px; border-radius:12px; font-size:13.5px;
            white-space:pre-wrap; word-break:break-word;
            backdrop-filter:blur(6px); animation:rise .35s ease; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  .user { align-self:flex-end; background:rgba(43,95,217,.28);
          border:1px solid rgba(43,95,217,.5); border-bottom-right-radius:3px; }
  .bot  { align-self:flex-start; background:var(--panel);
          border:1px solid var(--line); border-bottom-left-radius:3px; }
  .bot.mock { border-style:dashed; border-color:rgba(255,200,87,.45); }
  .bot .tag { display:block; margin-top:6px; color:var(--warn); font-size:11px; }
  .faded { opacity:.35; transition:opacity 1s; }

  /* ── 生命体征（右侧） ── */
  #vitals { position:fixed; right:26px; top:22px; width:220px;
            background:var(--panel); border:1px solid var(--line);
            border-radius:14px; padding:14px 16px; backdrop-filter:blur(8px); }
  #vitals h2 { font-size:11px; color:var(--cyan); letter-spacing:.3em;
               margin-bottom:10px; font-weight:500; }
  .stat { display:flex; justify-content:space-between; padding:3px 0;
          font-size:12.5px; color:var(--fg); }
  .stat span { color:var(--dim); }
  .stat b { font-weight:600; font-variant-numeric:tabular-nums;
            text-shadow:0 0 8px rgba(53,224,255,.4); }
  .bar { height:3px; background:rgba(53,224,255,.12); border-radius:2px;
         margin:2px 0 8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet));
           border-radius:2px; transition:width .8s; }

  /* ── 待批动作（右下） ── */
  #asks { position:fixed; right:26px; bottom:110px; width:220px;
          display:flex; flex-direction:column; gap:8px; }
  .ask { background:var(--panel); border:1px solid rgba(255,200,87,.4);
         border-radius:12px; padding:10px 12px; font-size:12px;
         backdrop-filter:blur(6px); animation:rise .35s ease; }
  .ask b { color:var(--warn); font-size:11px; letter-spacing:.1em; }
  .ask .row { display:flex; gap:8px; margin-top:8px; }
  .ask button { flex:1; background:transparent; color:var(--cyan);
                border:1px solid var(--line); border-radius:8px;
                padding:5px; cursor:pointer; font-size:12px; }
  .ask button:hover { background:rgba(53,224,255,.12); }
  .ask button.deny { color:#ff7a9c; border-color:rgba(255,122,156,.35); }

  /* ── 输入栏 ── */
  #inputbar { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
              width:min(620px, 76vw); display:flex; gap:10px; }
  #input { flex:1; background:rgba(10,18,30,.7); color:var(--fg);
           border:1px solid var(--line); border-radius:24px;
           padding:12px 20px; font-size:14px; outline:none;
           backdrop-filter:blur(8px); transition:border-color .3s, box-shadow .3s; }
  #input:focus { border-color:var(--cyan);
                 box-shadow:0 0 18px rgba(53,224,255,.25); }
  #send { background:transparent; color:var(--cyan);
          border:1px solid var(--line); border-radius:24px;
          width:88px; cursor:pointer; letter-spacing:.2em; }
  #send:hover { background:rgba(53,224,255,.12); }
  #send:disabled { opacity:.4; cursor:default; }
  .ops { margin-top:10px; display:flex; gap:8px; }
  .op { background:transparent; color:var(--cyan); border:1px solid var(--line);
        border-radius:8px; padding:4px 10px; font-size:11px; cursor:pointer;
        letter-spacing:.1em; }
  .op:hover { background:rgba(53,224,255,.12); }
  #introspect { position:fixed; right:26px; top:70px; width:360px;
                max-height:70vh; overflow-y:auto; background:rgba(8,14,24,.92);
                border:1px solid var(--line); border-radius:14px;
                padding:14px; backdrop-filter:blur(10px); z-index:10; }
  #introspect h2 { font-size:12px; color:var(--cyan); letter-spacing:.2em;
                   display:flex; justify-content:space-between; align-items:center; }
  #introspect pre { font-size:11px; color:var(--fg); white-space:pre-wrap;
                    word-break:break-all; margin-top:8px; }
  .hidden { display:none !important; }
  .togoal { display:inline-block; margin-left:10px; color:var(--cyan);
            font-size:11px; cursor:pointer; opacity:.7; border-bottom:
            1px dotted var(--cyan); }
  .togoal:hover { opacity:1; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ring" id="ring1"></div>
<div class="ring" id="ring2"></div>
<div class="ring" id="ring3"></div>

<div id="idcard">
  <h1>OCOS</h1>
  <div class="sub">DIGITAL ORGANISM · 数字生命</div>
  <div class="clock" id="clock"></div>
  <div class="ops">
    <button class="op" onclick="toggleIntrospect()">◉ 内视</button>
    <button class="op" onclick="selfImprove(this)">↻ 自省升级</button>
  </div>
</div>
<div id="introspect" class="hidden">
  <h2>INTROSPECTION · 内视 <button class="op" onclick="document.getElementById('introspect').classList.add('hidden')">✕</button></h2>
  <pre id="intro-body">加载中…</pre>
</div>

<div id="corestate">待命中</div>
<div id="chatcol"></div>

<div id="vitals">
  <h2>VITALS · 生命体征</h2>
  <div id="stats"><div class="stat"><span>连接中…</span></div></div>
</div>
<div id="asks"></div>

<div id="inputbar">
  <input id="input" placeholder="对它说点什么…（⏎ 发送）" autocomplete="off">
  <button id="send">发送</button>
</div>

<script>
/* ═══════════════ 生命核渲染（canvas 粒子神经球） ═══════════════ */
const scene = document.getElementById("scene");
const ctx2d = scene.getContext("2d");
let W, H;
function resize() {
  W = scene.width = innerWidth * devicePixelRatio;
  H = scene.height = innerHeight * devicePixelRatio;
  scene.style.width = innerWidth + "px";
  scene.style.height = innerHeight + "px";
}
addEventListener("resize", resize); resize();

/* 状态机: idle | thinking | speaking — 驱动核的呼吸/转速 */
const core = { state: "idle", speakUntil: 0 };

/* 星尘 */
const stars = Array.from({length: 130}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.4 + .3, tw: Math.random() * 6.28,
}));

/* 粒子神经球: 斐波那契球面 + 预计算近邻连线 */
const N = 220, points = [];
const golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const th = golden * i;
  points.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
}
const links = [];
for (let i = 0; i < N; i++)
  for (let j = i + 1; j < N; j++) {
    const dx = points[i].x - points[j].x, dy = points[i].y - points[j].y,
          dz = points[i].z - points[j].z;
    if (dx*dx + dy*dy + dz*dz < 0.075) links.push([i, j]);
  }

let rotY = 0, rotX = 0.35;
function drawScene(t) {
  ctx2d.clearRect(0, 0, W, H);
  const s = devicePixelRatio;

  /* 星尘闪烁 */
  for (const st of stars) {
    const a = .25 + .35 * Math.abs(Math.sin(t * .6 + st.tw));
    ctx2d.fillStyle = `rgba(160,200,255,${a * .5})`;
    ctx2d.fillRect(st.x * W, st.y * H, st.r * s, st.r * s);
  }

  /* 呼吸/说话脉动 */
  const cx = W / 2, cy = H * .44;
  const speaking = core.state === "speaking";
  const thinking = core.state === "thinking";
  const breath = 1 + .055 * Math.sin(t * 1.15)
               + (speaking ? .075 * Math.sin(t * 7.3) : 0);
  const R = Math.min(W, H) * .16 * breath;
  rotY += thinking ? .022 : .006;
  rotX = .35 + .08 * Math.sin(t * .23);

  /* 核心辉光 */
  const glow = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, R * 2.1);
  const gA = speaking ? .5 : thinking ? .38 : .26;
  glow.addColorStop(0, `rgba(53,224,255,${gA})`);
  glow.addColorStop(.45, `rgba(122,92,255,${gA * .35})`);
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx2d.fillStyle = glow;
  ctx2d.fillRect(cx - R*2.2, cy - R*2.2, R*4.4, R*4.4);

  /* 球面投影 */
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const proj = points.map(p => {
    let x = p.x * cosY + p.z * sinY;
    let z1 = -p.x * sinY + p.z * cosY;
    let y = p.y * cosX - z1 * sinX;
    let z = p.y * sinX + z1 * cosX;
    const k = R / (1 - z * .22);
    return { sx: cx + x * k, sy: cy + y * k, z };
  });

  /* 神经连线 */
  const linkA = speaking ? .34 : thinking ? .28 : .17;
  ctx2d.lineWidth = s * .7;
  for (const [i, j] of links) {
    const a = proj[i], b = proj[j];
    if (a.z > .55 && b.z > .55) continue;
    ctx2d.strokeStyle = `rgba(53,224,255,${linkA * (1 - (a.z + b.z) / 2.4)})`;
    ctx2d.beginPath(); ctx2d.moveTo(a.sx, a.sy); ctx2d.lineTo(b.sx, b.sy); ctx2d.stroke();
  }
  /* 节点 */
  for (const p of proj) {
    if (p.z > .6) continue;
    const size = (1.15 - p.z * .5) * s;
    ctx2d.fillStyle = `rgba(140,235,255,${.75 - p.z * .4})`;
    ctx2d.beginPath(); ctx2d.arc(p.sx, p.sy, size, 0, 6.28); ctx2d.fill();
  }
  /* 内核 */
  ctx2d.fillStyle = `rgba(220,250,255,${speaking ? .9 : .55})`;
  ctx2d.beginPath();
  ctx2d.arc(cx, cy, (speaking ? 7 : 4.5) * s * (1 + .2*Math.sin(t*3)), 0, 6.28);
  ctx2d.fill();

  requestAnimationFrame(() => drawScene(t + 1/60));
}
requestAnimationFrame(drawScene);

/* ═══════════════ 交互与数据 ═══════════════ */
const stream = document.getElementById("chatcol");
const input = document.getElementById("input");
const corestate = document.getElementById("corestate");

function setState(s, label) {
  core.state = s;
  corestate.textContent = label;
  corestate.style.opacity = label ? 1 : .4;
}

function bubble(text, who, mock) {
  const div = document.createElement("div");
  div.className = "bubble " + who + (mock ? " mock" : "");
  div.textContent = text;
  if (who === "user") {
    const op = document.createElement("span");
    op.className = "togoal";
    op.textContent = "→目标";
    op.title = "把这句话转为目标，daemon 自动认领执行";
    op.onclick = () => toGoal(text, op);
    div.appendChild(op);
  }
  if (mock) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "◦ 状态回复 · 未接入语言核心";
    div.appendChild(tag);
  }
  stream.appendChild(div);
  while (stream.children.length > 5) stream.firstChild.remove();
  const kids = [...stream.children];
  kids.slice(0, -2).forEach(k => k.classList.add("faded"));
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text || core.state === "thinking") return;
  bubble(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  setState("thinking", "处理中");
  try {
    const r = await fetch("/ocos/converse", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text}),
    });
    const j = await r.json();
    setState("speaking", "回应中");
    if (j.success) bubble(j.data.reply, "bot", j.data.mock);
    else bubble("出错: " + j.message, "bot");
    setTimeout(() => setState("idle", "待命中"), 3200);
  } catch (e) {
    setState("idle", "待命中");
    bubble("连接失败（ocos-server 在跑吗？）", "bot");
  }
  sendBtn.disabled = false;
  input.focus();
  refreshSide();
}
const sendBtn = document.getElementById("send");
sendBtn.onclick = send;
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* 时钟 */
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("zh-CN", {hour12: false});
}, 1000);

/* 生命体征 + 待批 */
async function refreshSide() {
  try {
    const d = (await (await fetch("/ocos/summary")).json()).data;
    const g = d.goals || {};
    const mem = d.memory || {};
    const memMax = Math.max(1, (mem.episodes || 0) + 10);
    document.getElementById("stats").innerHTML =
      `<div class="stat"><span>目标 P / A</span><b>${g.PENDING||0} / ${g.ACTIVE||0}</b></div>
       <div class="bar"><i style="width:${Math.min(100,((g.ACTIVE||0))*33)}%"></i></div>
       <div class="stat"><span>待批动作</span><b>${d.approvals_pending}</b></div>
       <div class="stat"><span>收件箱</span><b>${d.inbox_queued}</b></div>
       <div class="stat"><span>episodes</span><b>${mem.episodes||0}</b></div>
       <div class="bar"><i style="width:${Math.min(100,(mem.episodes||0)/memMax*100)}%"></i></div>
       <div class="stat"><span>beliefs</span><b>${mem.beliefs||0}</b></div>`;

    const rows = (await (await fetch("/ocos/approvals")).json()).data.pending;
    const box = document.getElementById("asks");
    box.innerHTML = "";
    if (rows.length) {
      const h = document.createElement("b");
      h.textContent = "需你裁决";
      box.appendChild(h);
    }
    for (const r of rows) {
      const card = document.createElement("div");
      card.className = "ask";
      card.innerHTML = `<b>${r.id}</b><br>${r.action_type}
        <div style="color:var(--dim)">${(r.text||"").slice(0,50)}</div>
        <div class="row">
          <button onclick="decide('${r.id}','approve')">批 准</button>
          <button class="deny" onclick="decide('${r.id}','deny')">拒 绝</button>
        </div>`;
      box.appendChild(card);
    }
  } catch (e) { /* 服务未起 — 静默重试 */ }
}
async function decide(pid, action) {
  await fetch(`/ocos/approvals/${pid}/${action}`, {method: "POST"});
  refreshSide();
}

async function toGoal(text, el) {
  el.textContent = "…";
  try {
    const r = await fetch("/ocos/goals-from-chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text}),
    });
    const j = await r.json();
    el.textContent = j.success ? "✓已入列" : "✗失败";
    bubble(`已把「${text.slice(0, 30)}」转为目标（${j.data.goal_id}），daemon 将自动认领执行。`, "bot");
  } catch (e) { el.textContent = "✗失败"; }
  refreshSide();
}

async function toggleIntrospect() {
  const panel = document.getElementById("introspect");
  if (!panel.classList.contains("hidden")) {
    panel.classList.add("hidden"); return;
  }
  panel.classList.remove("hidden");
  document.getElementById("intro-body").textContent = "内视中…";
  try {
    const j = await (await fetch("/ocos/introspect")).json();
    document.getElementById("intro-body").textContent =
      JSON.stringify(j.data, null, 2);
  } catch (e) {
    document.getElementById("intro-body").textContent = "内视失败: " + e;
  }
}

async function selfImprove(btn) {
  btn.disabled = true; btn.textContent = "自省中…";
  setState("thinking", "自省中");
  try {
    const j = await (await fetch("/ocos/self-improve", {method: "POST"})).json();
    const d = j.data;
    if (!d.proposals || !d.proposals.length) {
      bubble(d.note || "本轮没有值得记的改进点。", "bot", d.mock);
    } else {
      bubble(`自省完成，产生 ${d.proposals.length} 条升级提案，已进入待批队列等你裁决：` +
             d.proposals.map(p => "「" + p.title + "」").join(" "), "bot");
      refreshSide();
    }
  } catch (e) { bubble("自省失败: " + e, "bot"); }
  setState("idle", "待命中");
  btn.disabled = false; btn.textContent = "↻ 自省升级";
}
refreshSide();
setInterval(refreshSide, 5000);
input.focus();
</script>
</body>
</html>
